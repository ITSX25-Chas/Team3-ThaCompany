apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-website
spec:
  # Ingress-nginx owns node port 80; the app is reached through its Service.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: company-website
  template:
    metadata:
      labels:
        app: company-website
        git.commit: ${GIT_COMMIT}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # Existing SQLite files are root-owned: request volume permission repair.
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        image: ${DEPLOY_IMAGE}
        imagePullPolicy: Always
        ports:
        - containerPort: 7000
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: company-website-secrets
              key: SECRET_KEY
        - name: SESSION_COOKIE_SECURE
          value: "false"
        - name: FLASK_DEBUG
          value: "false"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 7000
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: company-website-data
