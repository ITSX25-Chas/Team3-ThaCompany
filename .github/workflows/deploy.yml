name: Deploy to K3s

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # GitHub Container Registry requires lowercase repository names.
  IMAGE: ghcr.io/itsx25-chas/team3-thacompany

jobs:
  tests:
    name: Test application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # --- Build & push to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v2.6.4'

      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Sign images with Cosign
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # --- Network connectivity to K3s node ---
      - name: Generate Ephemeral Headscale Key
        id: generate_key
        run: |
          EXPIRATION=$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)

          RESPONSE=$(curl -s -f -X POST "${{ secrets.HEADSCALE_URL }}/api/v1/preauthkey" \
            -H "Authorization: Bearer ${{ secrets.HEADSCALE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "user": "${{ vars.HEADSCALE_USER_ID }}",
                  "ephemeral": true,
                  "reusable": false,
                  "expiration": "'"$EXPIRATION"'",
                  "aclTags": ["tag:github-runner"]
                }')

          EPHEMERAL_KEY=$(echo "$RESPONSE" | jq -r '.preAuthKey.key')

          if [ -z "$EPHEMERAL_KEY" ] || [ "$EPHEMERAL_KEY" == "null" ]; then
            echo "Error: Failed to retrieve key from Headscale API"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$EPHEMERAL_KEY"
          echo "key=$EPHEMERAL_KEY" >> $GITHUB_OUTPUT

      - name: Connect to Headscale Mesh
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          authkey: ${{ steps.generate_key.outputs.key }}
          args: --login-server=${{ secrets.HEADSCALE_URL }}
          version: 1.102.4

      - name: Verify connectivity to K3s node
        run: |
          ping -c 3 10.0.${{ vars.TEAM_ID }}.3
          echo "Tailscale connectivity confirmed"

      # --- Configure kubectl for remote k3s ---
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl auth can-i patch deployments.apps -n default

      - name: Configure application secret
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          kubectl create secret generic company-website-secrets \
            --namespace=default \
            --from-literal=SECRET_KEY="$APP_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      # --- Deploy to K3s ---
      - name: Apply manifests and update image
        run: |
          export DEPLOY_IMAGE="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          export GIT_COMMIT="${{ github.sha }}"
          envsubst < k8s/deployment.yaml > /tmp/deployment.yaml
          kubectl delete ingress company-website --ignore-not-found
          kubectl apply -f /tmp/deployment.yaml -f k8s/pvc.yaml -f k8s/service.yaml -f k8s/ingress.yaml -f k8s/network-policy.yaml
          kubectl rollout status deployment/company-website --timeout=120s
